<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="BiGiPiG - Backend Java Developer, Moscow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BiGiPiG - Backend Java Developer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="60%" stop-color="#9fd0ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#8fb8ff" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <circle cx="985" cy="150" r="210" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="18" fill="none" stroke="#233247" stroke-width="1.5"/>

  <!-- accent bar -->
  <rect x="64" y="72" width="6" height="156" rx="3" fill="url(#bar)"/>

  <!-- text block -->
  <text x="96" y="128" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="68" font-weight="700" letter-spacing="2" fill="url(#name)">BiGiPiG</text>

  <text x="98" y="176" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="600" letter-spacing="0.5" fill="#c9d6e4">Backend Java Developer</text>

  <text x="98" y="214" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="17" letter-spacing="0.6" fill="#7d8fa6">Moscow, Russia &#183; Java &#183; Spring Boot &#183; PostgreSQL &#183; Kafka &#183; Docker</text>

  <!-- service graph -->
  <g stroke="#3b6ea5" stroke-width="1.6" opacity="0.85">
    <line x1="985" y1="150" x2="890" y2="76"/>
    <line x1="985" y1="150" x2="1096" y2="92"/>
    <line x1="985" y1="150" x2="905" y2="228"/>
    <line x1="985" y1="150" x2="1088" y2="215"/>
    <line x1="890" y1="76" x2="1096" y2="92" opacity="0.4"/>
    <line x1="905" y1="228" x2="1088" y2="215" opacity="0.4"/>
  </g>

  <g>
    <circle cx="985" cy="150" r="27" fill="#0d1b2a" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="985" cy="150" r="8" fill="#58a6ff"/>
    <circle cx="890" cy="76" r="14" fill="#0d1b2a" stroke="#7fb4e8" stroke-width="2"/>
    <circle cx="1096" cy="92" r="14" fill="#0d1b2a" stroke="#7fb4e8" stroke-width="2"/>
    <circle cx="905" cy="228" r="14" fill="#0d1b2a" stroke="#7fb4e8" stroke-width="2"/>
    <circle cx="1088" cy="215" r="14" fill="#0d1b2a" stroke="#7fb4e8" stroke-width="2"/>
  </g>
</svg>
